name: Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install"
      - name: "Build"
        run: "yarn build"
      - name: "Test"
        run: "yarn test"
      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: build-artifact
          path: |
            packages/*/dist

  detect-publish-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect-publish.outputs.publish }}
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: "Detect publish"
        id: "detect-publish"
        run: |
          result=`./scripts/detect_release.sh`
          echo $result
          echo "publish=$result" >> "$GITHUB_OUTPUT"

  publish-canary:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: "Download build artifacts"
        uses: actions/download-artifact@v6
        with:
          name: build-artifact
          path: packages
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
          registry-url: https://registry.npmjs.org
          scope: "@vertexvis"
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install"
      - name: "Publish Canary to NPM"
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPMJS_ACCESS_TOKEN }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          ./scripts/publish_canary.sh

  publish-release:
    runs-on: ubuntu-latest
    needs: [build, detect-publish-release, publish-canary]
    if: needs.detect-publish-release.outputs.publish == 1
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: "Download build artifacts"
        uses: actions/download-artifact@v6
        with:
          name: build-artifact
          path: packages
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
          registry-url: https://registry.npmjs.org
          scope: "@vertexvis"
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install"
      - name: "Publish Release to NPM"
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPMJS_ACCESS_TOKEN }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: "./scripts/publish_release.sh"
