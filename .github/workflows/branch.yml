name: Branch

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install --frozen-lockfile --ignore-scripts"
      - name: "Build"
        run: "yarn build"
      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: build-artifact
          path: |
            packages/*/dist
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v4
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install --frozen-lockfile --ignore-scripts"
      - name: "Lint"
        run: "yarn lint"
  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: "Checkout changes"
        uses: actions/checkout@v6
      - name: "Download build artifacts"
        uses: actions/download-artifact@v6
        with:
          name: build-artifact
          path: packages
      - name: 'Setup Node'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: "Install"
        run: "yarn install --frozen-lockfile --ignore-scripts"
      - name: "Download Chromium"
        run: "yarn install:chromium"
      - name: "Test"
        run: "yarn test:coverage"
